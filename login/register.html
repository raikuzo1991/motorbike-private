<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      background:#ffffff;
    }

    .wrapper{
      width:400px;
      padding:30px;
      border:1px solid #ddd;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      background:#fff;
    }

    h2{
      text-align:center;
      margin-bottom:25px;
    }

    .input-field{
      margin-bottom:20px;
    }

    .input-field label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
    }

    .input-field input{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
      outline:none;
    }

    .input-field input:focus{
      border-color:#007bff;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:5px;
      background:#007bff;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }

    .login-link{
      text-align:center;
      margin-top:15px;
    }

    .login-link a{
      color:#007bff;
      text-decoration:none;
    }

    .login-link a:hover{
      text-decoration:underline;
    }
  </style>

</head>
<body>

  <div class="wrapper">
    <form action="#">
      <h2>Register</h2>

      <div class="input-field">
        <label>Username</label>
        <input type="text" required>
      </div>

      <div class="input-field">
        <label>Email</label>
        <input type="email" required>
      </div>

      <div class="input-field">
        <label>Password</label>
        <input type="password" required>
      </div>

      <div class="input-field">
        <label>Confirm Password</label>
        <input type="password" required>
      </div>

      <button type="submit">Register</button>

      <div class="login-link">
        <p>Already have an account?
          <a href="index.html">Login</a>
        </p>
      </div>

    </form>
  </div>

</body>
</html>
